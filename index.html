<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>訂餐統計小工具</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e3e6ec;--pr:#2f5bea;--prt:#fff;--wa:#b54708;--wab:#fff4e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2029;--tx:#e8eaf0;--mu:#98a2b3;--bd:#2c3340;--pr:#6b8cff;--prt:#0b1020;--wa:#fdb022;--wab:#3a2a0a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2029;--tx:#e8eaf0;--mu:#98a2b3;--bd:#2c3340;--pr:#6b8cff;--prt:#0b1020;--wa:#fdb022;--wab:#3a2a0a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{min-height:260px;resize:vertical}
textarea.sm{min-height:70px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:130px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 14px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mu);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.who{white-space:normal;color:var(--mu);font-size:13px}
th{font-size:13px;color:var(--mu)}td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
.warn{background:var(--wab);color:var(--wa);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px;white-space:pre-wrap}
.hint{color:var(--mu);font-size:12px;margin-top:4px}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>訂餐統計小工具</h1>
  <p class="sub">貼上大家的訂餐文字，自動統計各餐點份數、小計與總計。所有運算都在你的瀏覽器內完成，不會上傳任何資料。</p>

  <div class="grid">
    <div class="card">
      <h2>① 貼上訂餐文字</h2>
      <textarea id="src" placeholder="例如：&#10;Lulu 吻仔魚粥$85&#10;Ollie 霸王粥 $120謝謝"></textarea>
      <div class="row">
        <button class="p" id="go">統計</button>
        <button id="demo">載入範例</button>
        <button id="clr">清空</button>
      </div>
    </div>

    <div class="card">
      <details>
        <summary>② 解析規則（格式不同時在這裡調整）</summary>
        <label>解析模式</label>
        <select id="mode">
          <option value="smart">智慧模式：找到金額，金額前「姓名＋餐點」</option>
          <option value="regex">自訂正規表示式（進階）</option>
        </select>

        <div id="smartBox">
          <label>金額的判斷規則（正規表示式，需有一組括號擷取數字）</label>
          <input id="priceRe">
          <label>姓名佔幾個詞（以空白分隔）</label>
          <input id="nameN" type="number" min="1" max="5">
          <label>姓名與餐點的分隔方式</label>
          <select id="nameMode">
            <option value="first">姓名在最前面</option>
            <option value="last">姓名在最後面（餐點 金額 姓名 這類）</option>
          </select>
          <div class="hint">「姓名在最後面」時，會取金額之前為餐點、金額之後第一個詞為姓名。</div>
        </div>

        <div id="regexBox" hidden>
          <label>自訂正規表示式（需包含具名群組 name、item、price）</label>
          <input id="customRe">
          <div class="hint">例：<code>^(?&lt;name&gt;\S+)\s+(?&lt;item&gt;.+?)\s*\$(?&lt;price&gt;\d+)</code></div>
        </div>

        <label>要從餐點名稱移除的雜訊字（每行或用逗號分隔）</label>
        <textarea id="strip" class="sm"></textarea>
        <label>忽略含有這些關鍵字的整行</label>
        <textarea id="skip" class="sm"></textarea>
        <label>餐點別名合併（每行一組：寫法=標準名稱）</label>
        <textarea id="alias" class="sm" placeholder="魚粥=吻仔魚粥"></textarea>
        <label><input type="checkbox" id="byPrice" style="width:auto"> 同餐點但價格不同時，分開計算</label>
        <div class="row"><button id="reset">還原預設規則</button></div>
        <div class="hint">規則會自動存在這個瀏覽器，下次開啟仍會保留。</div>
      </details>
    </div>
  </div>

  <div class="card" id="out" hidden>
    <h2>③ 統計結果</h2>
    <div class="kpis">
      <div class="kpi"><b id="kCnt">0</b><span>總份數</span></div>
      <div class="kpi"><b id="kAmt">$0</b><span>總金額</span></div>
      <div class="kpi"><b id="kPpl">0</b><span>訂購人數</span></div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>餐點</th><th class="n">單價</th><th class="n">份數</th><th class="n">小計</th><th>訂購人</th></tr></thead>
      <tbody id="tb"></tbody>
      <tfoot><tr><td>總計</td><td></td><td class="n" id="fCnt"></td><td class="n" id="fAmt"></td><td></td></tr></tfoot>
    </table></div>
    <div class="row">
      <button class="p" id="cpShop">複製給店家（餐點×份數）</button>
      <button id="cpFull">複製含訂購人明細</button>
      <span class="hint" id="msg" style="align-self:center"></span>
    </div>
    <div class="warn" id="bad" hidden></div>
  </div>
</div>

<script>
// ===== 預設規則 =====
const DEF = {
  mode:'smart',
  priceRe:'(?:NT\\$|\\$|＄)\\s*(\\d+)|(\\d+)\\s*元',
  nameN:1, nameMode:'first',
  customRe:'^(?<name>\\S+)\\s+(?<item>.+?)\\s*\\$(?<price>\\d+)',
  strip:'謝謝\n感謝\n感N\n感n\n(感謝)\n（感謝）\n~\n～',
  skip:'',
  alias:'',
  byPrice:true
};
const DEMO = `夢奇奇 吻仔魚粥$85
皮卡丘 吻仔魚粥$85,謝謝
劉口水 蛋炒飯 $75 感謝(感謝)
王小明  雞肉蛋炒飯加大   $110
拍咪呀 吻仔魚炒飯$110 感N
黑傑克 青椒羊肉炒飯 $100
Lucas 肉絲炒飯加大 $95
Sharon 什錦烏龍湯麵 $85`;
const $ = id => document.getElementById(id);
const KEY = 'order-tally-rules-v1';
const F = ['mode','priceRe','nameN','nameMode','customRe','strip','skip','alias'];

// ===== 規則讀寫（localStorage 可能不可用，需 try/catch）=====
function load(){
  let c = {...DEF};
  try{ const s = localStorage.getItem(KEY); if(s) c = {...c, ...JSON.parse(s)}; }catch(e){}
  F.forEach(k => $(k).value = c[k]);
  $('byPrice').checked = !!c.byPrice;
  toggle();
}
function cfg(){
  const c = {};
  F.forEach(k => c[k] = $(k).value);
  c.nameN = Math.max(1, parseInt(c.nameN)||1);
  c.byPrice = $('byPrice').checked;
  return c;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cfg())); }catch(e){} }
function toggle(){
  const r = $('mode').value === 'regex';
  $('regexBox').hidden = !r; $('smartBox').hidden = r;
}
const lines = s => s.split(/[\n,，]/).map(x=>x.trim()).filter(Boolean);
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

// ===== 解析核心 =====
function parse(text, c){
  const rows = [], bad = [];
  const strip = lines(c.strip), skip = lines(c.skip);
  const alias = {};
  c.alias.split(/\n/).forEach(l => { const [a,b] = l.split('='); if(a&&b) alias[a.trim()] = b.trim(); });
  let custom = null, price = null;
  try{
    if(c.mode === 'regex') custom = new RegExp(c.customRe, 'u');
    else price = new RegExp(c.priceRe, 'u');
  }catch(e){ return {rows, bad:['規則的正規表示式有誤：' + e.message]}; }

  const clean = s => {
    strip.forEach(w => { s = s.split(w).join(' '); });
    return s.replace(/\s+/g,' ').replace(/^[\s,，、:：\-]+|[\s,，、:：\-]+$/g,'');
  };

  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    if(skip.some(k => line.includes(k))) continue;
    let name, item, amt;

    if(custom){
      const m = line.match(custom);
      if(m && m.groups && m.groups.price){ name = m.groups.name; item = m.groups.item; amt = +m.groups.price; }
    }else{
      const m = line.match(price);
      if(m){
        amt = +(m.slice(1).find(x => x !== undefined) || NaN);
        const before = line.slice(0, m.index).trim();
        const after = line.slice(m.index + m[0].length).trim();
        if(c.nameMode === 'first'){
          const t = before.split(/\s+/);
          if(t.length > c.nameN){ name = t.slice(0, c.nameN).join(' '); item = t.slice(c.nameN).join(' '); }
          else if(before.length > 1){ // 沒空白時，退而求其次：第一個詞當姓名
            const mm = before.match(/^([A-Za-z]+|[\u4e00-\u9fa5]{2,3})(.+)$/); if(mm){ name = mm[1]; item = mm[2]; }
          }
        }else{
          name = after.split(/\s+/)[0]; item = before;
        }
      }
    }
    if(name === undefined || !item || !(amt >= 0)){
      // 只有雜訊（例如單獨一行「感謝🙏」）就靜默略過
      if(clean(line).replace(/[^\p{L}\p{N}]/gu,'') === '') continue;
      bad.push(line); continue;
    }
    item = clean(item); name = clean(name);
    item = alias[item] || item;
    if(!item){ bad.push(line); continue; }
    rows.push({name, item, amt});
  }
  return {rows, bad};
}

// ===== 統計 =====
function tally(rows, byPrice){
  const m = new Map();
  rows.forEach(r => {
    const k = byPrice ? r.item + '\u0000' + r.amt : r.item;
    if(!m.has(k)) m.set(k, {item:r.item, price:r.amt, qty:0, sum:0, who:[]});
    const g = m.get(k); g.qty++; g.sum += r.amt; g.who.push(r.name);
    if(g.price !== r.amt) g.price = null; // 合併後價格不一致
  });
  return [...m.values()].sort((a,b) => b.qty - a.qty || a.item.localeCompare(b.item,'zh-Hant'));
}

let last = null;
function run(){
  save();
  const c = cfg();
  const {rows, bad} = parse($('src').value, c);
  const g = tally(rows, c.byPrice);
  const cnt = rows.length, amt = rows.reduce((s,r)=>s+r.amt,0);
  last = {g, cnt, amt};
  $('out').hidden = false;
  $('kCnt').textContent = cnt;
  $('kAmt').textContent = '$' + amt.toLocaleString();
  $('kPpl').textContent = new Set(rows.map(r=>r.name)).size;
  $('tb').innerHTML = g.map(x => `<tr><td>${esc(x.item)}</td><td class="n">${x.price===null?'不一':'$'+x.price}</td><td class="n">${x.qty}</td><td class="n">$${x.sum.toLocaleString()}</td><td class="who">${esc(x.who.join('、'))}</td></tr>`).join('') || '<tr><td colspan="5">沒有辨識到任何訂單</td></tr>';
  $('fCnt').textContent = cnt;
  $('fAmt').textContent = '$' + amt.toLocaleString();
  const b = $('bad');
  b.hidden = !bad.length;
  if(bad.length) b.textContent = '以下行無法辨識，已略過，請檢查或調整規則：\n' + bad.join('\n');
}

function copy(t){
  const done = () => { $('msg').textContent = '已複製'; setTimeout(()=>$('msg').textContent='',2000); };
  const fb = () => { const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');done();}catch(e){$('msg').textContent='複製失敗，請手動選取';} a.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
}
const fmt = (withWho) => {
  if(!last) return '';
  const l = last.g.map(x => `${x.item}${x.price===null?'':' $'+x.price} × ${x.qty} = $${x.sum}` + (withWho ? `（${x.who.join('、')}）` : ''));
  return l.join('\n') + `\n---\n共 ${last.cnt} 份，總計 $${last.amt}`;
};

$('go').onclick = run;
$('demo').onclick = () => { $('src').value = DEMO; run(); };
$('clr').onclick = () => { $('src').value = ''; $('out').hidden = true; };
$('cpShop').onclick = () => copy(fmt(false));
$('cpFull').onclick = () => copy(fmt(true));
$('mode').onchange = () => { toggle(); save(); };
$('reset').onclick = () => { try{ localStorage.removeItem(KEY); }catch(e){} load(); if($('src').value) run(); };
[...F, 'byPrice'].forEach(k => $(k).addEventListener('change', () => { save(); if($('src').value.trim()) run(); }));
load();
</script>
</body>
</html>
